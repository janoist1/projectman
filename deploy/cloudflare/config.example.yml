# Template for the public entrance of the live projectman (PM-200, PM-210); guide: docs/DEPLOY.md,
# section "Public entry through Cloudflare Tunnel and Access".
#
# Copy it to ~/.cloudflared/config.yml (outside the repository, mode 600) and replace every
# <PLACEHOLDER>. Nothing in this file is a secret, but the files it points to are: never commit,
# paste or message the credentials file, the tunnel token or the account certificate.
#
# Check it with:
#   cloudflared tunnel --config ~/.cloudflared/config.yml ingress validate
#   cloudflared tunnel --config ~/.cloudflared/config.yml ingress rule https://chopper.istvan.io/hooks/x
#   cloudflared tunnel --config ~/.cloudflared/config.yml ingress rule https://<FEEDBACK-HOSTNAME>/api/setup
#   cloudflared tunnel --config ~/.cloudflared/config.yml ingress rule https://<FEEDBACK-HOSTNAME>/feedback/widget.js
# (the second command must print the http_status:404 rule; /api/setup must print the 4800 rule; on the
# widget's hostname /api/setup must print the 404 rule and /feedback/widget.js the 4800 rule).

# The tunnel's id, printed by `cloudflared tunnel create <name>`.
tunnel: <TUNNEL-UUID>
# Written by `cloudflared tunnel create`. Keep it at mode 600, in a mode-700 directory, outside
# the repository.
credentials-file: /Users/<USER>/.cloudflared/<TUNNEL-UUID>.json

# Rules are tried in order and the first match wins.
ingress:
  # The marking widget's public entrance (PM-506, PM-513): a hostname of its own, only /feedback/, and
  # no Access application, because the widget runs on a customer's page and cannot sign in to Access.
  # Everything else on this hostname is refused here, and the server refuses it a second time (the host
  # guard behind PROJECTMAN_FEEDBACK_PUBLIC_URL). Again NO `httpHostHeader`: the guard reads the Host.
  - hostname: <FEEDBACK-HOSTNAME>
    path: ^/feedback/
    service: http://127.0.0.1:4800
  - hostname: <FEEDBACK-HOSTNAME>
    service: http_status:404

  # Optional separate machine hostname (PM-675). Configure PROJECTMAN_INTEGRATOR_HOSTNAME
  # on the server and create its own Service Auth application first. Its audience is never
  # the human application's or the engine's. EC2 uses the generated config on port 4700.
  - hostname: <INTEGRATOR-HOSTNAME>
    path: ^/api/
    service: http://127.0.0.1:4800
    originRequest:
      access:
        required: true
        teamName: <TEAM>
        audTag: [<INTEGRATOR-AUD-TAG>]
  - hostname: <INTEGRATOR-HOSTNAME>
    path: ^/mcp$
    service: http://127.0.0.1:4800
    originRequest:
      access:
        required: true
        teamName: <TEAM>
        audTag: [<INTEGRATOR-AUD-TAG>]
  - hostname: <INTEGRATOR-HOSTNAME>
    service: http_status:404

  # Internal member doors and the integrator's old board door stay closed.
  - hostname: chopper.istvan.io
    path: ^/hooks
    service: http_status:404
  - hostname: chopper.istvan.io
    path: ^/mcp/
    service: http_status:404
  - hostname: chopper.istvan.io
    path: ^/mcp$
    service: http_status:404

  # The live instance, and only it (never the development ports, 4700 or 5173).
  #
  # Deliberately NO `httpHostHeader` and no other Host rewrite: the server derives the expected
  # origin from the Host header (https://chopper.istvan.io). Rewriting it to 127.0.0.1 would
  # break the origin check and make a remote request look local.
  - hostname: chopper.istvan.io
    service: http://127.0.0.1:4800
    originRequest:
      # cloudflared verifies the Cloudflare Access token itself before it passes the request to
      # this Mac, so a request that did not go through the Access application is refused here
      # too.
      access:
        required: true
        # The Zero Trust team name: <TEAM> in https://<TEAM>.cloudflareaccess.com
        teamName: <TEAM>
        # The Application Audience (AUD) tag of the Access application for chopper.istvan.io
        # (Zero Trust > Access > Applications > the application > Overview).
        audTag:
          - <AUD-TAG>

  # Everything else (another hostname pointed at this tunnel by mistake, no hostname at all).
  # cloudflared requires the last rule to be a catch-all.
  - service: http_status:404
